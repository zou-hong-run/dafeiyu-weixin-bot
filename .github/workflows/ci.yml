name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 版本由 package.json 的 packageManager 字段决定，不用在这写死
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # 拆成两步：一眼看出是测试挂了还是别的检查挂了。
      # 失败摘要塞进**一条** annotation（GitHub 每步最多 10 条，逐行发会被丢掉）。
      - name: 单元测试
        run: |
          set -o pipefail
          if pnpm test 2>&1 | tee /tmp/test.log; then
            exit 0
          fi
          echo "===== 失败详情 ====="
          tail -60 /tmp/test.log
          echo "===== 结束 ====="
          SUMMARY=$(grep -E "not ok|Error|expected|actual|AssertionError" /tmp/test.log | head -6 | tr '\n' ' ' | cut -c1-400)
          echo "::error title=单元测试失败::${SUMMARY:-见日志}"
          exit 1

      - name: 全量检查
        run: |
          set -o pipefail
          if pnpm check 2>&1 | tee /tmp/check.log; then
            exit 0
          fi
          echo "===== 失败详情 ====="
          tail -60 /tmp/check.log
          echo "===== 结束 ====="
          SUMMARY=$(grep -E "^✗|没通过|not ok|Error" /tmp/check.log | head -6 | tr '\n' ' ' | cut -c1-400)
          echo "::error title=检查失败::${SUMMARY:-见日志}"
          exit 1
